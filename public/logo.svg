<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dark Command Canvas Squircle -->
  <rect width="512" height="512" rx="112" fill="#080c14" />

  <!-- Outer Bold 'C' Aperture Ring -->
  <path d="M 374 125 A 176 176 0 1 0 374 387" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="56" 
        stroke-linecap="round" />

  <!-- 3 City Buildings / Infrastructure Columns -->
  <!-- Left Building -->
  <path d="M 200 350 L 200 308 L 230 292 L 230 350 Z" fill="#ffffff" />
  
  <!-- Center Building (Taller, Peaked Apex) -->
  <path d="M 242 350 L 242 276 L 256 264 L 270 276 L 270 350 Z" fill="#ffffff" />

  <!-- Right Building -->
  <path d="M 282 350 L 282 292 L 312 308 L 312 350 Z" fill="#ffffff" />

  <!-- Central Location Beacon / Eye Pin -->
  <path d="M 256 160 C 224 160 198 186 198 218 C 198 254 246 298 256 304 C 266 298 314 254 314 218 C 314 186 288 160 256 160 Z" 
        fill="url(#pinGradient)"
        filter="url(#glow)" />

  <!-- Inner Eye Aperture / Pupil -->
  <circle cx="256" cy="218" r="26" fill="#080c14" />
</svg>
